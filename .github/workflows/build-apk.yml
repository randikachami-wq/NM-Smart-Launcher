name: Build NM Smart Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup Java 17
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==================================================
      # 3. Setup Android SDK
      # ==================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==================================================
      # 4. Install Android SDK
      # ==================================================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ==================================================
      # 5. Find project ZIP
      # ==================================================
      - name: Find project ZIP
        run: |
          echo "Searching for project ZIP..."

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "ZIP FOUND: $ZIP"

          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"


      # ==================================================
      # 6. Extract project
      # ==================================================
      - name: Extract launcher project
        run: |
          rm -rf launcher-project

          mkdir -p launcher-project

          unzip -o "$PROJECT_ZIP" -d launcher-project

          echo "Project extracted."

          echo "Project contents:"
          find launcher-project -maxdepth 3 -type f | head -100


      # ==================================================
      # 7. Locate Gradle project
      # ==================================================
      - name: Locate Android Gradle project
        run: |
          echo "Searching for settings.gradle files..."

          PROJECT_FILE=$(find launcher-project \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -type f | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 8. Show Gradle files
      # ==================================================
      - name: Inspect Gradle configuration
        run: |
          echo "======================================"
          echo "Gradle files"
          echo "======================================"

          find "$PROJECT_DIR" \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -type f -print


      # ==================================================
      # 9. FIX Java 8 / Kotlin 17 mismatch
      # ==================================================
      - name: Fix Java and Kotlin JVM target
        run: |
          echo "======================================"
          echo "Fixing JVM target compatibility"
          echo "======================================"

          export PROJECT_DIR

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          print("Project:", project)

          gradle_files = list(project.rglob("*.gradle")) + \
                         list(project.rglob("*.gradle.kts"))

          if not gradle_files:
              print("ERROR: No Gradle files found.")
              raise SystemExit(1)

          for file in gradle_files:

              try:
                  text = file.read_text(encoding="utf-8")
              except Exception:
                  continue

              original = text

              # ------------------------------------------
              # Java 8 -> Java 17
              # ------------------------------------------

              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )

              text = text.replace(
                  "JavaVersion.VERSION_8",
                  "JavaVersion.VERSION_17"
              )

              text = text.replace(
                  "JavaVersion.VERSION_1_7",
                  "JavaVersion.VERSION_17"
              )

              # ------------------------------------------
              # Kotlin JVM target 1.8 -> 17
              # ------------------------------------------

              text = re.sub(
                  r'jvmTarget\s*=\s*["\']1\.8["\']',
                  'jvmTarget = "17"',
                  text
              )

              text = re.sub(
                  r'jvmTarget\s*=\s*["\']8["\']',
                  'jvmTarget = "17"',
                  text
              )

              # ------------------------------------------
              # Kotlin compilerOptions target 1.8
              # ------------------------------------------

              text = re.sub(
                  r'jvmTarget\.set\s*\(\s*["\']1\.8["\']\s*\)',
                  'jvmTarget.set(JvmTarget.JVM_17)',
                  text
              )

              # ------------------------------------------
              # Java targetCompatibility strings
              # ------------------------------------------

              text = re.sub(
                  r'targetCompatibility\s*=\s*["\']1\.8["\']',
                  'targetCompatibility = "17"',
                  text
              )

              text = re.sub(
                  r'sourceCompatibility\s*=\s*["\']1\.8["\']',
                  'sourceCompatibility = "17"',
                  text
              )

              # ------------------------------------------
              # Write only if changed
              # ------------------------------------------

              if text != original:

                  file.write_text(
                      text,
                      encoding="utf-8"
                  )

                  print("FIXED:", file)

              else:
                  print("OK:", file)

          PY


      # ==================================================
      # 10. Force Java 17 compile options
      # ==================================================
      - name: Apply Java 17 compatibility
        run: |
          export PROJECT_DIR

          python3 <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          app_dirs = list(project.glob("app"))

          if not app_dirs:
              print("WARNING: app directory not found.")
              raise SystemExit(0)

          app = app_dirs[0]

          gradle_kts = app / "build.gradle.kts"
          gradle = app / "build.gradle"

          if gradle_kts.exists():

              text = gradle_kts.read_text(
                  encoding="utf-8"
              )

              if "sourceCompatibility = JavaVersion.VERSION_17" not in text:

                  block = """

// ======================================================
// NM Smart Launcher - Java 17 compatibility
// Automatically added by GitHub Actions
// ======================================================

android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}
"""

                  gradle_kts.write_text(
                      text + block,
                      encoding="utf-8"
                  )

                  print("Java 17 configuration added.")

              else:
                  print("Java 17 configuration already exists.")

          elif gradle.exists():

              text = gradle.read_text(
                  encoding="utf-8"
              )

              if "JavaVersion.VERSION_17" not in text:

                  block = """

// NM Smart Launcher Java 17 compatibility

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}
"""

                  gradle.write_text(
                      text + block,
                      encoding="utf-8"
                  )

                  print("Java 17 configuration added.")

              else:
                  print("Java 17 configuration already exists.")

          else:
              print("ERROR: app/build.gradle(.kts) not found.")
              raise SystemExit(1)

          PY


      # ==================================================
      # 11. Display final Gradle configuration
      # ==================================================
      - name: Verify JVM configuration
        run: |
          echo "======================================"
          echo "FINAL GRADLE CONFIGURATION"
          echo "======================================"

          find "$PROJECT_DIR" \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -type f \
            -exec sh -c '
              echo ""
              echo "===== $1 ====="
              cat "$1"
            ' _ {} \;


      # ==================================================
      # 12. Make Gradle wrapper executable
      # ==================================================
      - name: Prepare Gradle wrapper
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "WARNING: Gradle wrapper not found."
          fi


      # ==================================================
      # 13. Clean project
      # ==================================================
      - name: Clean Gradle project
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi


      # ==================================================
      # 14. Build Debug APK
      # ==================================================
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING NM SMART LAUNCHER APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              assembleDebug \
              --no-daemon \
              --stacktrace

          else

            echo "Gradle wrapper not found."
            echo "Using system Gradle."

            gradle \
              assembleDebug \
              --no-daemon \
              --stacktrace

          fi


      # ==================================================
      # 15. Find APK
      # ==================================================
      - name: Find APK
        run: |
          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*debug*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            APK=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1)

          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "======================================"
          echo "APK FOUND:"
          echo "$APK"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/NM-Smart-Launcher.apk"


      # ==================================================
      # 16. Upload APK
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NM-Smart-Launcher-APK
          path: output/NM-Smart-Launcher.apk
          if-no-files-found: error


      # ==================================================
      # 17. Build summary
      # ==================================================
      - name: Build successful
        if: success()
        run: |
          echo "======================================"
          echo "       BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "NM Smart Launcher APK created."
          echo ""
          echo "Artifact:"
          echo "NM-Smart-Launcher-APK"
          echo ""
          echo "======================================"
