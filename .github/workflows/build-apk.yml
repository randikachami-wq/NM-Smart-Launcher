name: Build NM Smart Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Download repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Install Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 4. Install Android SDK
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      # --------------------------------------------------
      # 5. Extract project ZIP
      # --------------------------------------------------
      - name: Extract launcher project
        run: |

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP file was not found."
            exit 1
          fi

          echo "Project ZIP found:"
          echo "$ZIP"

          rm -rf launcher-project

          mkdir -p launcher-project

          unzip -o "$ZIP" -d launcher-project

          echo ""
          echo "Project files:"
          find launcher-project -maxdepth 3 -type f | head -100

      # --------------------------------------------------
      # 6. Locate Android project
      # --------------------------------------------------
      - name: Locate Android project
        run: |

          PROJECT=$(find launcher-project -name "settings.gradle.kts" -type f | head -n 1)

          if [ -z "$PROJECT" ]; then

            PROJECT=$(find launcher-project -name "settings.gradle" -type f | head -n 1)

          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android Gradle project was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 7. Force Java/Kotlin JVM target to 17
      # --------------------------------------------------
      - name: Fix JVM target compatibility
        run: |

          echo "Searching Gradle files..."

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print

          echo ""
          echo "Applying Java 17 compatibility..."

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i \
            -e 's/sourceCompatibility[[:space:]]*=[[:space:]]*JavaVersion.VERSION_1_8/sourceCompatibility = JavaVersion.VERSION_17/g' \
            -e 's/targetCompatibility[[:space:]]*=[[:space:]]*JavaVersion.VERSION_1_8/targetCompatibility = JavaVersion.VERSION_17/g' \
            -e 's/jvmTarget[[:space:]]*=[[:space:]]*"1\.8"/jvmTarget = "17"/g' \
            -e 's/jvmTarget[[:space:]]*=[[:space:]]*"8"/jvmTarget = "17"/g' \
            {} \;

          echo ""
          echo "Gradle files after modification:"

          grep -Rni \
            -E "jvmTarget|sourceCompatibility|targetCompatibility" \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      # --------------------------------------------------
      # 8. Make sure Gradle wrapper is executable
      # --------------------------------------------------
      - name: Prepare Gradle wrapper
        run: |

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Gradle wrapper not found."
            exit 1
          fi

      # --------------------------------------------------
      # 9. Clean previous build
      # --------------------------------------------------
      - name: Clean project
        run: |

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 10. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        run: |

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # --------------------------------------------------
      # 11. Find APK
      # --------------------------------------------------
      - name: Find APK
        run: |

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/NM-Smart-Launcher.apk"

      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NM-Smart-Launcher-APK
          path: output/NM-Smart-Launcher.apk
          if-no-files-found: error
