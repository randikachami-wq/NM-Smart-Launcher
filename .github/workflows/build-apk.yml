name: Build NM Smart Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Download repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 4. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # --------------------------------------------------
      # 5. Extract project ZIP
      # --------------------------------------------------
      - name: Extract launcher project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP file was not found."
            exit 1
          fi

          echo "Project ZIP found: $ZIP"

          rm -rf launcher-project
          mkdir -p launcher-project
          unzip -o "$ZIP" -d launcher-project

      # --------------------------------------------------
      # 6. Locate Android project
      # --------------------------------------------------
      - name: Locate Android project
        run: |
          PROJECT=$(find launcher-project -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android Gradle project was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "Android project located at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 7. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Gradle wrapper not found. Using system Gradle..."
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # --------------------------------------------------
      # 8. Find APK
      # --------------------------------------------------
      - name: Find APK
        run: |
          echo "Searching for APK..."
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK FOUND: $APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/NM-Smart-Launcher.apk"

      # --------------------------------------------------
      # 9. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NM-Smart-Launcher-APK
          path: output/NM-Smart-Launcher.apk
          if-no-files-found: error
